<div [ngClass]="theme" class="container">

      <!-- Toolbar -->
      <mat-toolbar color="primary">
        Factory + Material Demo
      </mat-toolbar>

      <!-- Card -->
      <mat-card>
        <h2>Theme</h2>
        <p>Current Theme: {{ theme }}</p>

        <!-- Button -->
        <button mat-raised-button color="accent">
          Material Button
        </button>
      </mat-card>

    </div>
